name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pushing the built site to the gh-pages branch needs write access to the repo.
permissions:
  contents: write

# Let a newer push cancel an in-flight deploy rather than queue behind it.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - run: bun install --frozen-lockfile

      # Prerenders every route to static HTML and skips nitro (no SSR runtime on Pages).
      - run: bun run build:pages

      # Publish dist/client as the root of the gh-pages branch. Each deploy is a
      # fresh single-commit history, so the branch never accumulates stale assets.
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist/client
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA} from ${GITHUB_REF_NAME}"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
